name: CI

# 两条分支都留着。master 是本地一直在推进的主线；远端那条 main 只有 7 个提交，
# 根提交和 master 不是同一个（早期经 GitHub REST API 同步时另起了一条线），
# 内容重复、进度还停在「界面重设计」那一步。默认分支切到 master 之后，
# 触发器要是还只写 main，推再多也不会跑一次。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: 全量回归（${{ matrix.os }} / ${{ matrix.deps }}）
    runs-on: ${{ matrix.os }}
    env:
      # Windows runner 上 python 的 stdout 用的是系统 ANSI 代码页，不是 UTF-8。
      # 回归里三十多套会往标准输出打中文和 ✓，编码不对就整片死在
      # UnicodeEncodeError 上 —— 报的是「打不出来」，不是「代码有问题」。
      # 本地按 cp1252 复现过：35 套里 33 套红，连汇总那行 print 也一起崩；
      # 同一个检出改成 UTF-8 输出就是 35/35 全绿。
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      # 两档的差别只在数据库驱动：
      #   core —— 装齐 requirements.txt，含四家数据库驱动；
      #   no-driver —— 只装核心依赖，验证「不装驱动也能启动、能跑完整回归」。
      # 驱动是函数内延迟 import 的设计（core/db/connect.py），
      # 这个承诺必须有门禁守着，否则某次改动把它挪到模块顶层就静悄悄地破了。
      # 两个 os 是因为 Windows 上的 DPAPI 凭据加密路径（secret_store 里
      # 「盘上必须是密文」那组断言）之前只在 ubuntu 验过「不加密」分支，
      # Windows 分支从没在 CI 跑过 —— 加 windows-latest 才真正守住了加密承诺。
      matrix:
        os: [ubuntu-latest, windows-latest]
        deps: [core, no-driver]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
        # 前端逻辑断言（100 项）靠 jsdom 跑在 node 上。ubuntu / windows runner
        # 都自带 node，但这里显式 pin 一版，保证 jsdom 装得上、版本稳定。

      - name: 装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # requirements.txt 末尾有一行 `-r requirements-db.txt`，把可选驱动带进来。
          # core 档照原样装；no-driver 档把那行剔掉，只装核心 ——
          # 这样「不装驱动也能跑」这条承诺就在 CI 里有真实环境去验。
          if [ "${{ matrix.deps }}" = "no-driver" ]; then
            grep -v '^-r requirements-db' requirements.txt > req-core.txt
            pip install -r req-core.txt
          else
            pip install -r requirements.txt
          fi
          # 回归专用依赖：tests/ 里十几套都用 fastapi 的 TestClient，而 starlette
          # 只把它要的这个包列成可选 extra，pip 不会自动带 —— 漏装时四条腿会一起
          # 红在第 9 步，报错是「TestClient 需要 xxx 包」，跟被测代码无关。
          # 两档都要装：它不是数据库驱动，不影响上面 no-driver 的承诺。
          pip install -r requirements-dev.txt

      - name: 确认驱动真的没装（no-driver）
        if: matrix.deps == 'no-driver'
        shell: bash
        run: |
          for p in pymysql pg8000 pyodbc oracledb; do
            if python -c "import $p" 2>/dev/null; then
              echo "::error::$p 不该出现在 no-driver 环境里"
              exit 1
            fi
          done
          echo "已确认：四家数据库驱动均未安装"

      - name: 装前端测试依赖（jsdom）
        # 不装也能跑，但那 100 项前端断言会直接静默跳过 —— 门禁就空了。
        # windows runner 默认 shell 是 PowerShell，显式 shell: bash 让 npm 走 Git Bash。
        shell: bash
        run: npm install --no-save jsdom

      - name: 生成示例数据
        # samples/ 入库的只有生成器，八份样例（xlsx / docx / pdf / png / csv / db / md）
        # 全是跑出来的 —— .gitignore 里那条注释就写着「clone 后跑一次」。
        # CI 是干净检出，不补这一步，smoke、compat、type_matrix 三套会直接抛
        # FileNotFoundError: samples\销售明细（带合并标题）.xlsx，
        # 红的是「文件不存在」，跟回归要验的东西一点关系没有。
        shell: bash
        run: python samples/make_samples.py

      - name: 全量回归
        shell: bash
        run: python tests/run_all.py

  declared-deps:
    name: 依赖声明一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 顶层 import 的第三方包必须在 requirements.txt 里声明
        # 这条门禁是有来由的：Pillow 曾被 core/render/combine.py 顶层 import，
        # 却只靠 matplotlib / reportlab 间接带进来，requirements.txt 里没写。
        # 间接依赖一旦断链，用户就会遇到「照文档装完依赖，服务还是起不来」。
        # 只查顶层 import —— 函数内的延迟 import 就是刻意的可选依赖，不算漏声明。
        run: python tools/check_declared_deps.py
