name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: 全量回归（${{ matrix.deps }} 依赖）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 两档的差别只在数据库驱动：
      #   core —— 装齐 requirements.txt，含四家数据库驱动；
      #   no-driver —— 只装核心依赖，验证「不装驱动也能启动、能跑完整回归」。
      # 驱动是函数内延迟 import 的设计（core/db/connect.py），
      # 这个承诺必须有门禁守着，否则某次改动把它挪到模块顶层就静悄悄地破了。
      matrix:
        deps: [core, no-driver]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 装核心依赖
        run: |
          python -m pip install --upgrade pip
          # 数据库驱动单独一行，方便 no-driver 档裁掉
          grep -vE '^(PyMySQL|pg8000|pyodbc|oracledb)' requirements.txt > /tmp/req-core.txt
          pip install -r /tmp/req-core.txt

      - name: 装数据库驱动（core）
        if: matrix.deps == 'core'
        run: pip install PyMySQL pg8000 pyodbc oracledb

      - name: 确认驱动真的没装（no-driver）
        if: matrix.deps == 'no-driver'
        run: |
          for p in pymysql pg8000 pyodbc oracledb; do
            if python -c "import $p" 2>/dev/null; then
              echo "::error::$p 不该出现在 no-driver 环境里"
              exit 1
            fi
          done
          echo "已确认：四家数据库驱动均未安装"

      - name: 装前端测试依赖（jsdom）
        # 不装也能跑，但那 100 项前端断言会直接静默跳过 —— 门禁就空了。
        run: npm install --no-save jsdom

      - name: 全量回归
        run: python tests/run_all.py

  declared-deps:
    name: 依赖声明一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 顶层 import 的第三方包必须在 requirements.txt 里声明
        # 这条门禁是有来由的：Pillow 曾被 core/render/combine.py 顶层 import，
        # 却只靠 matplotlib / reportlab 间接带进来，requirements.txt 里没写。
        # 间接依赖一旦断链，用户就会遇到「照文档装完依赖，服务还是起不来」。
        # 只查顶层 import —— 函数内的延迟 import 就是刻意的可选依赖，不算漏声明。
        run: python tools/check_declared_deps.py
